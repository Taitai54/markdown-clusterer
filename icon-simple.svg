<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#1a1a2e" rx="20"/>
  
  <!-- Books (left side) -->
  <rect x="30" y="90" width="25" height="40" fill="#e74c3c" rx="2"/>
  <rect x="35" y="60" width="22" height="35" fill="#3498db" rx="2"/>
  <rect x="25" y="135" width="28" height="42" fill="#2ecc71" rx="2"/>
  
  <!-- Books (right side) -->
  <rect x="201" y="85" width="25" height="40" fill="#9b59b6" rx="2"/>
  <rect x="199" y="130" width="22" height="35" fill="#f39c12" rx="2"/>
  <rect x="206" y="55" width="28" height="42" fill="#1abc9c" rx="2"/>
  
  <!-- Books (top) -->
  <rect x="110" y="20" width="36" height="25" fill="#e67e22" rx="2"/>
  
  <!-- Central folder with glow -->
