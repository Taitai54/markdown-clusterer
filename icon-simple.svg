  <path d="M 196 150 L 171 140" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Arrowheads -->
  <polygon points="85,115 80,110 80,120" fill="#4a90e2" opacity="0.6"/>
  <polygon points="171,115 176,110 176,120" fill="#4a90e2" opacity="0.6"/>
  <polygon points="128,85 123,90 133,90" fill="#4a90e2" opacity="0.6"/>
  <polygon points="85,140 80,135 80,145" fill="#4a90e2" opacity="0.6"/>
