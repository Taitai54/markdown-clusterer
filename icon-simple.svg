  <!-- Arrow indicators -->
  <path d="M 60 100 L 85 115" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 196 100 L 171 115" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 128 50 L 128 85" stroke="#4a90e2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
